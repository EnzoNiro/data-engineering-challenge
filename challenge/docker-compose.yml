x-airflow-common: &airflow-common
  build:
    context: ./docker/airflow
    dockerfile: Dockerfile
  image: wecogno-airflow:latest
  user: "${AIRFLOW_UID:-50000}:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: wecogno-local-dev-secret
    PYTHONPATH: /opt/airflow
    # Data warehouse (porta interna do container, não a publicada no host)
    WAREHOUSE_HOST: warehouse
    WAREHOUSE_PORT: "5432"
    WAREHOUSE_DB: ${WAREHOUSE_DB:-wecogno_dw}
    WAREHOUSE_USER: ${WAREHOUSE_USER:-wecogno}
    WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:-wecogno}
    # Spark em modo local
    SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-3g}
    SPARK_LOCAL_CORES: ${SPARK_LOCAL_CORES:-4}
    # Caminhos dentro do container
    DATA_DIR: /opt/airflow/data
    SOURCE_DIR: /opt/airflow/nyc-tlc-data
    OUTPUT_DIR: /opt/airflow/outputs
    SQL_DIR: /opt/airflow/sql
  volumes:
    - ./dags:/opt/airflow/dags
    - ./etl:/opt/airflow/etl
    - ./sql:/opt/airflow/sql
    - ./data:/opt/airflow/data
    - ../nyc-tlc-data:/opt/airflow/nyc-tlc-data
    - ./outputs:/opt/airflow/outputs
    - ./logs:/opt/airflow/logs

services:
  # Metadados do Airflow (separado do data warehouse de propósito)
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Data warehouse: schemas raw, trusted e refined (criados por sql/init)
  warehouse:
    image: postgres:16
    environment:
      POSTGRES_USER: ${WAREHOUSE_USER:-wecogno}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-wecogno}
      POSTGRES_DB: ${WAREHOUSE_DB:-wecogno_dw}
    command: >
      postgres
      -c shared_buffers=1GB
      -c work_mem=256MB
      -c maintenance_work_mem=512MB
      -c max_wal_size=8GB
      -c checkpoint_timeout=15min
      -c synchronous_commit=off
    ports:
      - "${WAREHOUSE_HOST_PORT:-5433}:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_USER:-wecogno} -d ${WAREHOUSE_DB:-wecogno_dw}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com || true
    depends_on:
      airflow-db:
        condition: service_healthy
      warehouse:
        condition: service_healthy
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  airflow-db-data:
  warehouse-data:
